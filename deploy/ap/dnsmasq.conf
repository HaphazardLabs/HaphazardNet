# HaphazardNet DHCP + captive-portal DNS for the wlan0 AP.
interface=wlan0
bind-interfaces
except-interface=eth0           # never serve DHCP/DNS on the SDR segment

# AP clients: 192.168.10.100-200, gateway+DNS = the Pi itself
dhcp-range=192.168.10.100,192.168.10.200,255.255.255.0,12h
dhcp-option=3,192.168.10.1
dhcp-option=6,192.168.10.1

# Captive portal: resolve EVERY name to the panel so phones pop the sign-in
# sheet. TAK clients connect by IP:port so this never affects ATAK/WinTAK.
no-resolv
address=/#/192.168.10.1

# lease file the panel reads to list "who's on the net"
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
