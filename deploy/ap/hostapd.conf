# HaphazardNet AP — onboard wlan0, 2.4GHz (Zero 2W radio is 2.4GHz only)
interface=wlan0
driver=nl80211
ssid=HaphazardTAK
country_code=US
hw_mode=g
channel=6
ieee80211d=1
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# placeholder — set at deploy time (AP_PASSPHRASE in install.sh). Don't commit a real key.
wpa_passphrase=CHANGEME

# clients talk to each other through the AP (team picture in Net mode)
ap_isolate=0
