# systemd drop-in for hostapd — installed to
#   /etc/systemd/system/hostapd.service.d/rfkill.conf
# Pi Zero 2W boots with WLAN rfkill soft-blocked, so hostapd fails with
# "rfkill: WLAN soft blocked" -> "Could not connect to kernel driver".
# Unblock right before every hostapd start so the AP comes up on every boot.
[Service]
ExecStartPre=/usr/sbin/rfkill unblock wlan
