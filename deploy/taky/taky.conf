# Minimal taky config for the offline field kit — plain CoT on :8087 (no TLS),
# matching how the TAK Pi build exposed :8087 for ATAK/WinTAK.
# NOTE: verify against the installed taky version's schema (taky --help / docs);
# taky's config keys have shifted slightly between releases.
[taky]
hostname = haphazardnet
node_id = HaphazardNet
bind_ip = 0.0.0.0
public_ip = 192.168.10.1

[cot_server]
port = 8087

[dp_server]
# data package server (offline data packages); leave default

[ssl]
# no client certs for the field kit — plain TCP CoT
