#!/usr/sbin/nft -f
# HaphazardNet base firewall/NAT — applied in both modes.
# Bidirectional NAT so AP clients (wlan0) and the SDR (eth0) can reach each
# other: client -> SDR for gRPC(:8000)/web(:80), SDR -> client for callbacks.
# Captive-portal name resolution is handled by dnsmasq (address=/#/), so no
# DNAT redirect is needed here — the panel answers on :80 at 192.168.10.1.

flush ruleset

table inet haphazard {
    chain forward {
        type filter hook forward priority filter; policy accept;
    }
}

table ip haphazard_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth0"  masquerade   # AP client -> SDR segment
        oifname "wlan0" masquerade   # SDR -> AP client
    }
}
