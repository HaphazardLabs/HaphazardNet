# systemd-tmpfiles rule — installed to /etc/tmpfiles.d/haphazard.conf
# /run is tmpfs (wiped each boot). The panel requires /run/haphazard via
# ReadWritePaths and the CoT relay writes callsigns.json there, so recreate it
# early on every boot, owned by the panel's service user.
d /run/haphazard 0755 haphazardnet haphazardnet -
